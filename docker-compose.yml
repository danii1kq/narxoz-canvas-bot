services:
  bot:
    build: .
    image: narxoz-canvas-bot:latest
    container_name: narxoz-canvas-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Database is persisted on a named volume.
      DB_PATH: /data/bot.db
      TZ: Asia/Almaty
      # The Mini App listens here; Caddy terminates HTTPS in front of it.
      WEBAPP_ADDR: :8080
      WEBAPP_URL: ${WEBAPP_URL:-}
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS for the Mini App ("Open" button in the chat). Started together with
  # the bot; without WEBAPP_DOMAIN in .env Caddy has no site and the app is not
  # reachable from Telegram — run `docker compose up -d bot` in that case.
  caddy:
    image: caddy:2-alpine
    container_name: narxoz-canvas-caddy
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      WEBAPP_DOMAIN: ${WEBAPP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
  caddy-data:
  caddy-config:
